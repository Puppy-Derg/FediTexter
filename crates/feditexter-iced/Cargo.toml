[package]
name = "feditexter-iced"
version = "0.1.28"
edition = "2024"

[dependencies]
env_logger = "0.11"
iced = { version = "0.14", features = ["tokio", "image", "svg", "canvas", "lazy"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.20"
url = "2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "pnm"] }
base64 = "0.22"
rfd = "0.15"
chrono = "0.4"
webrtc = "0.20"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
async-trait = "0.1"
hmac = "0.12"
sha1 = "0.10"
dirs-next = "2"
infer = "0.16"
open = "5"
iced_aw = { version = "0.14.1", default-features = false, features = ["spinner"] }

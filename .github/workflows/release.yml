name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build server binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p feditexter-server

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/feditexter-server

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: feditexter-server
          path: target/x86_64-unknown-linux-musl/release/feditexter-server

  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: feditexter-iced-macos-arm64
            binary: feditexter-iced
            ffmpeg: build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: feditexter-iced-windows-x64.exe
            binary: feditexter-iced.exe
            ffmpeg: vcpkg
            vcpkg_triplet: x64-windows-static-md
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: feditexter-iced-windows-arm64.exe
            binary: feditexter-iced.exe
            ffmpeg: vcpkg
            vcpkg_triplet: arm64-windows-static-md
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: feditexter-iced-linux-x64
            binary: feditexter-iced
            ffmpeg: build
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: feditexter-iced-linux-arm64
            binary: feditexter-iced
            ffmpeg: build
    runs-on: ${{ matrix.os }}
    env:
      # audiopus_sys (used by the opus crate) builds the bundled libopus with
      # cmake; its CMakeLists declares cmake_minimum_required(VERSION 3.1),
      # which CMake >= 3.27 refuses. Tell CMake to tolerate the old minimum.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev \
            libfontconfig1-dev libfreetype6-dev libssl-dev pkg-config \
            libasound2-dev libv4l-dev libpipewire-0.3-dev libspa-0.2-dev \
            libgbm-dev libegl1-mesa-dev
          # build-essential/nasm are required by the static FFmpeg source build
          # (gcc+make, and nasm for x86 asm on the x86_64 job).
          # The aarch64 job runs natively on an arm64 runner (ubuntu-24.04-arm),
          # so the packages above are native — no cross toolchain needed.
          # libasound2-dev (cpal), libv4l-dev (nokhwa camera), libpipewire/libspa
          # (xcap screen capture), and libgbm/libegl (xcap's Mesa capture stack)
          # are required by the voice chat feature's audio/video capture stack.
          # nasm is required by FFmpeg's x86 asm (x86_64 job only).

      - name: Build static FFmpeg
        if: matrix.ffmpeg == 'build'
        run: |
          .github/scripts/build-ffmpeg.sh "$GITHUB_WORKSPACE/.ffmpeg"
          echo "FFMPEG_DIR=$GITHUB_WORKSPACE/.ffmpeg" >> "$GITHUB_ENV"

      - name: Cache vcpkg FFmpeg
        if: matrix.ffmpeg == 'vcpkg'
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-ffmpeg-${{ matrix.vcpkg_triplet }}-9.0

      - name: Install FFmpeg via vcpkg
        if: matrix.ffmpeg == 'vcpkg'
        shell: bash
        run: |
          echo "VCPKG_ROOT=C:/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKGRS_TRIPLET=${{ matrix.vcpkg_triplet }}" >> "$GITHUB_ENV"
          if [ ! -d C:/vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg C:/vcpkg
          fi
          C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          C:/vcpkg/vcpkg.exe install "ffmpeg[avcodec,avformat,swscale,swresample]:${{ matrix.vcpkg_triplet }}" --clean-after-build

      - name: Build client
        run: cargo build --release --target ${{ matrix.target }} -p feditexter-iced

      - name: Rename binary
        shell: bash
        run: |
          ls target/${{ matrix.target }}/release/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "target/${{ matrix.target }}/release/${{ matrix.name }}"

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.name }}

  package-macos-app:
    needs: [build-client]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS arm64
        uses: actions/download-artifact@v4
        with:
          name: feditexter-iced-macos-arm64
          path: dist/arm64

      - name: Create app bundle
        shell: bash
        run: |
          mkdir -p "FediTexter.app/Contents/MacOS"
          cp "dist/arm64/feditexter-iced-macos-arm64" "FediTexter.app/Contents/MacOS/FediTexter"
          chmod +x "FediTexter.app/Contents/MacOS/FediTexter"
          plutil -create xml1 "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleName -string "FediTexter" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleDisplayName -string "FediTexter" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string "com.feditexter.client" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string "FediTexter" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundlePackageType -string "APPL" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleShortVersionString -string "1.0" "FediTexter.app/Contents/Info.plist"
          plutil -insert CFBundleVersion -string "1" "FediTexter.app/Contents/Info.plist"
          plutil -insert LSMinimumSystemVersion -string "12.0" "FediTexter.app/Contents/Info.plist"
          plutil -insert NSHighResolutionCapable -bool YES "FediTexter.app/Contents/Info.plist"
          plutil -insert NSPrincipalClass -string "NSApplication" "FediTexter.app/Contents/Info.plist"
          plutil -insert NSMicrophoneUsageDescription -string "FediTexter uses the microphone for voice channels." "FediTexter.app/Contents/Info.plist"
          plutil -insert NSCameraUsageDescription -string "FediTexter uses the camera for video in voice channels." "FediTexter.app/Contents/Info.plist"
          plutil -insert NSScreenCaptureUsageDescription -string "FediTexter shares your screen in voice channels when you choose to." "FediTexter.app/Contents/Info.plist"
          codesign --force --deep -s - "FediTexter.app"

      - name: Zip app bundle
        shell: bash
        run: |
          ditto -c -k --keepParent "FediTexter.app" "feditexter-iced-macos-arm64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: feditexter-iced-macos-arm64.zip
          path: feditexter-iced-macos-arm64.zip

  release:
    needs: [build-server, build-client, package-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/feditexter-server/feditexter-server
            artifacts/feditexter-iced-windows-x64.exe/feditexter-iced-windows-x64.exe
            artifacts/feditexter-iced-windows-arm64.exe/feditexter-iced-windows-arm64.exe
            artifacts/feditexter-iced-linux-x64/feditexter-iced-linux-x64
            artifacts/feditexter-iced-linux-arm64/feditexter-iced-linux-arm64
            artifacts/feditexter-iced-macos-arm64.zip/feditexter-iced-macos-arm64.zip
          generate_release_notes: true

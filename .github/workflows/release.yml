name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build server binary
        run: cargo build --release --target x86_64-unknown-linux-musl -p feditexter-server

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/feditexter-server

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: feditexter-server
          path: target/x86_64-unknown-linux-musl/release/feditexter-server

  build-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: feditexter-client-macos-arm64
            binary: feditexter-client
          - os: macos-latest
            target: x86_64-apple-darwin
            name: feditexter-client-macos-x64
            binary: feditexter-client
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: feditexter-client-windows-x64.exe
            binary: feditexter-client.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: feditexter-client-linux-x64
            binary: feditexter-client
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgtk-3-dev libssl-dev pkg-config

      - name: Build client
        run: cargo build --release --target ${{ matrix.target }} -p feditexter-client

      - name: Rename binary
        shell: bash
        run: |
          ls target/${{ matrix.target }}/release/
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "target/${{ matrix.target }}/release/${{ matrix.name }}"

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.name }}

  package-macos-app:
    needs: [build-client]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS arm64
        uses: actions/download-artifact@v4
        with:
          name: feditexter-client-macos-arm64
          path: dist/arm64

      - name: Download macOS x64
        uses: actions/download-artifact@v4
        with:
          name: feditexter-client-macos-x64
          path: dist/x64

      - name: Create universal binary + app bundle
        shell: bash
        run: |
          mkdir -p "FediTexter.app/Contents/MacOS"
          lipo -create \
            "dist/arm64/feditexter-client-macos-arm64" \
            "dist/x64/feditexter-client-macos-x64" \
            -output "FediTexter.app/Contents/MacOS/FediTexter"
          cat > "FediTexter.app/Contents/Info.plist" <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key><string>FediTexter</string>
    <key>CFBundleDisplayName</key><string>FediTexter</string>
    <key>CFBundleIdentifier</key><string>com.feditexter.client</string>
    <key>CFBundleExecutable</key><string>FediTexter</string>
    <key>CFBundlePackageType</key><string>APPL</string>
    <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
    <key>CFBundleShortVersionString</key><string>1.0</string>
    <key>CFBundleVersion</key><string>1</string>
    <key>LSMinimumSystemVersion</key><string>12.0</string>
    <key>NSHighResolutionCapable</key><true/>
    <key>NSPrincipalClass</key><string>NSApplication</string>
</dict>
</plist>
EOF
          chmod +x "FediTexter.app/Contents/MacOS/FediTexter"
          codesign --force --deep -s - "FediTexter.app"

      - name: Zip app bundle
        shell: bash
        run: |
          ditto -c -k --keepParent "FediTexter.app" "feditexter-client-macos-universal.zip"

      - name: Upload universal app
        uses: actions/upload-artifact@v4
        with:
          name: feditexter-client-macos-universal
          path: feditexter-client-macos-universal.zip

  release:
    needs: [build-server, build-client, package-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
